<style>

.fx-float.bad{fill:var(--bad)}.fx-float.warn{fill:var(--warn)}.fx-float.you{fill:var(--you)}

.lensbar{position:absolute;left:10px;top:10px;z-index:4;display:flex;flex-direction:column;align-items:flex-start;gap:6px;pointer-events:none}
.lensbar .seg{display:flex;gap:2px;background:#0a1220e6;border:1px solid var(--borders);border-radius:9px;padding:2px;pointer-events:auto}
.lensbar button{font-family:var(--sans);font-size:11.5px;padding:5px 10px;border:0;border-radius:7px;background:transparent;color:var(--t2);cursor:pointer}

.lensbar button[disabled]{opacity:.4;cursor:not-allowed}

.lenskey[hidden]{display:none}
.lenskey b{color:var(--text);font-weight:600;margin-bottom:2px}
.lenskey i{display:inline-block;width:12px;height:9px;border-radius:2px;margin-right:6px;vertical-align:-1px;border:1px solid var(--borders)}

@media(max-width:800px){
 .lenskey{top:58px;bottom:auto;flex-direction:row;flex-wrap:wrap;gap:3px 7px;padding:5px 8px;font-size:9.5px;max-width:calc(100% - 20px)}
 .lenskey b{width:100%;margin:0}
 .lenskey span{display:flex;flex-direction:column;align-items:center}
 .lenskey i{margin:0 0 2px;width:18px}
 .lenskey .full{display:none}.lenskey .short{display:inline}}
.country{fill:var(--land);stroke:var(--lstroke);stroke-width:.3;cursor:pointer;transition:fill .5s,stroke .5s}
.country:hover{filter:brightness(1.4)}

.country.annex{fill:var(--annexl);stroke:var(--annex);stroke-width:.5}

.country.ally{stroke:var(--you);stroke-dasharray:2.5 1.5;stroke-width:.55}
.country.sel{stroke:#fff;stroke-width:.9}
.p5star{fill:#dfe7f2;font-size:var(--star,7px);pointer-events:none;font-family:var(--sans)}

.tip .g{color:var(--econ)}.tip .p5{color:var(--you)}
.side{border-left:1px solid var(--border);background:var(--panel);overflow-y:auto;padding:13px}
.card{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:11px}
.eyebrow{font-size:10px;letter-spacing:.17em;text-transform:uppercase;color:var(--t3);font-family:var(--mono);margin-bottom:7px}
.cname{font-size:17px;font-weight:600}
.tag{display:inline-block;font-size:10px;font-family:var(--mono);padding:2px 7px;border-radius:20px;margin-left:7px;vertical-align:2px;text-transform:uppercase;letter-spacing:.07em}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:9px}
.metric .k{font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:.09em;font-family:var(--mono)}
.metric .v{font-size:16px;font-weight:600;font-family:var(--mono);margin-top:2px}
.pv{display:flex;flex-wrap:wrap;gap:3px 12px;margin-top:6px;font-size:11px;font-family:var(--mono);font-weight:500}
.pvd b{font-size:9px;letter-spacing:-1px}.pvd.good{color:var(--good)}.pvd.bad{color:var(--bad)}.pvd.neutral,.pvop{color:var(--t2)}.pv i{font-style:normal}

.row{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;padding:4px 0;border-bottom:1px solid #17243710}

.row .v{font-family:var(--mono);font-weight:600}
.bar{height:6px;border-radius:4px;background:#0a121e;overflow:hidden;margin-top:5px;border:1px solid #1b2a41}
.barf{height:100%;background:var(--econ);width:0;transition:width .3s}
.barf.rel{background:var(--you)}.barf.appr{background:var(--good)}.barf.debt{background:var(--warn)}
.acts{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.slab{margin-top:11px}.slab label{display:flex;justify-content:space-between;font-size:11px;color:var(--t2);font-family:var(--mono);margin-bottom:3px}
input[type=range]{width:100%;accent-color:var(--you);height:4px}
.hint{font-size:13px;color:var(--t2);line-height:1.6}
.fpc{border:1px solid var(--border);border-radius:8px;padding:6px 10px;margin-top:8px;background:var(--panel2)}.fpc>summary{cursor:pointer;font-size:13px;padding:3px 0}
.fpstage{color:var(--bad);background:#2a1211}.fpstage.ceasefire,.fpstage.dispute,.fpstage.crisis{color:var(--warn);background:#2a2110}.fpstage.settled{color:var(--good);background:#0f2a1d}
.fpview{margin:8px 0 2px;padding:8px 10px;border-left:3px solid var(--bad);background:#1a1014;font-size:13.5px;font-weight:600;color:var(--text)}
.fpsub{margin-top:6px}.fpsub>summary{cursor:pointer;font-size:12px;color:var(--t2)}.fpl{margin:6px 0;padding-left:18px;font-size:12px;color:var(--t2);line-height:1.5}.fpl li{margin:3px 0}
.src{color:var(--t3);font-size:10.5px}.fpasof{font-size:11.5px;color:var(--t3)}.fprole{font-size:12px;margin-top:6px}.fpacts{flex-wrap:wrap}.fpacts .btn{text-align:left}
.stars{color:var(--you);letter-spacing:2px;font-size:14px}.stars .off{color:var(--t3);opacity:.5}.pickgrid{margin-top:8px}.pickgrid .fpl{padding-left:16px}

.fpmark.ceasefire .fpdot,.fpmark.dispute .fpdot,.fpmark.crisis .fpdot{fill:var(--warn)}.fpmark.ceasefire .fpring,.fpmark.dispute .fpring,.fpmark.crisis .fpring{stroke:var(--warn)}.fpmark.settled .fpdot{fill:var(--good)}.fpmark.settled .fpring{stroke:var(--good);animation:none;opacity:.4}

#hint{flex-wrap:wrap}#hint span{flex:1 1 220px}
.fpgrp{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--t3);font-family:var(--mono);margin-top:8px}
.fc{margin-top:12px;border:1px solid var(--border);border-radius:8px;padding:6px 10px;background:var(--panel2)}.fc summary{cursor:pointer;font-size:12.5px;color:var(--text);font-weight:600;padding:3px 0}

const CMP={'>':(a,b)=>a>b,'<':(a,b)=>a<b,'>=':(a,b)=>a>=b,'<=':(a,b)=>a<=b};
const holds=([k,op,v])=>CMP[op](READINGS[k](),v);
function eventOpen(ev){return (!ev.when||ev.when.every(holds))&&(!ev.whenAny||ev.whenAny.some(holds));}
/* one vital step: the same arithmetic the events used as closures (pay() for a cost, ×(1+v) for GDP, clamp for the rest) */
function moveVital(o,spec,v,lim){
 if(spec.how==='share'){if(spec.f==='treasury'&&v<0){pay(o.gdp*-v);return;}o[spec.f]+=o.gdp*v;if(spec.lo!=null&&o[spec.f]<spec.lo)o[spec.f]=spec.lo;return;}
 if(spec.how==='mul'){o[spec.f]*=(1+v);return;}
 const lo=lim?lim[0]:spec.lo,hi=lim?lim[1]:spec.hi;o[spec.f]=lo==null?o[spec.f]+v:clamp(o[spec.f]+v,lo,hi);}
function applyEffects(opt,ev){
 const e=opt.eff||{};for(const k in e)moveVital(me,VITALS[k],e[k],opt.limits?.[k]);
 const fp=ev&&ev.fp?FP[ev.fp]:null;
 if(fp){if(opt.fpeff)fpMove(fp.id,opt.fpeff);for(const k in opt.rel||{})fpRel(fp,k,opt.rel[k]);
  if(opt.pub)me.approval=clamp(me.approval+fpPublicSwing(fp,opt.fpeff?.stance||0,opt.pub),0,100);}
 if(opt.target){const id=pressured(opt.target)[0];if(id){const c=C[id];
  for(const op of opt.ops||[])OPS[op].run(c,opt.target);
  const t=opt.teff||{};for(const k in t)moveVital(c,TARGET_VITALS[k],t[k]);}}
 return opt.r;}
/* what an option moves, for the card's dots: dir +1/-1, two arrows from `big`, tone from whether the move helps you */
function effectPreview(opt,ev){const out=[];
 const add=(k,spec,v)=>out.push({k,label:spec.label,dir:Math.sign(v),n:Math.abs(v)>=spec.big?2:1,tone:spec.good===0?'neutral':Math.sign(v)===spec.good?'good':'bad'});
 const e=opt.eff||{};for(const k in e)add(k,VITALS[k],e[k]);
 const t=opt.teff||{};for(const k in t)add(k,TARGET_VITALS[k],t[k]);
 for(const op of opt.ops||[])out.push({k:op,label:OPS[op].label(opt.target),op:true});
 const fp=ev&&ev.fp?FP[ev.fp]:null;
 if(fp){const f=opt.fpeff||{};for(const k of ['heat','peace','front'])if(f[k]&&(k!=='front'||fp.front))add('fp.'+k,FP_VITALS[k],f[k]);
  for(const k in opt.rel||{}){const ids=k==='a'||k==='b'?fp.sides[k].ids:[k];for(const id of ids)if(id!==player)out.push({k:'rel.'+id,label:'Relations with '+(C[id]?.name||id),dir:Math.sign(opt.rel[k]),n:Math.abs(opt.rel[k])>=6?2:1,tone:opt.rel[k]>0?'good':'bad'});}
  if(opt.pub&&me){const v=fpPublicSwing(fp,f.stance||0,opt.pub);if(v)add('approval',VITALS.approval,v);}
  if(f.stance)out.push({k:'stance',label:'Leans toward '+fp.sides[f.stance>0?'a':'b'].name,op:true});}
 return out;}

function fpFresh(fp){return{stage:fp.start.stage,heat:fp.start.heat,peace:fp.start.peace,front:fp.start.front??0,months:0,you:{stance:0,legal:0,acts:0}};}
function fpSideOf(fp,id){return fp.sides.a.ids.includes(id)?'a':fp.sides.b.ids.includes(id)?'b':null;}
function fpSign(side){return side==='a'?1:side==='b'?-1:0;}
function fpRole(fp,id){if(fpSideOf(fp,id))return 'party';if(fp.mediators.includes(id))return 'mediator';if(fp.backers.some(b=>b[0]===id))return 'backer';if(fp.stakes[id])return 'stake';return 'bystander';}
function fpPublic(fp,id){for(const p of fp.public){if((p.ids&&p.ids.includes(id))||(p.group&&GROUPINGS[p.group]?.has(id))||(p.bloc&&BLOCS[p.bloc]?.has(id)))return p;}return{care:0.15,side:null};}

 order.forEach(id=>{if(id!==player&&C[id].rel<32)hostile.add(id);});

 const edge=[];for(let la=-90;la<=90;la+=3)edge.push(proj(-180,la));for(let la=90;la>=-90;la-=3)edge.push(proj(180,la));

 for(let la=-60;la<=60;la+=30){const pts=[];for(let lo=-180;lo<=180;lo+=10)pts.push(proj(lo,la));g+='<path class="grat" d="'+polyD(pts)+'"/>';}
 for(let lo=-150;lo<=150;lo+=30){const pts=[];for(let la=-85;la<=85;la+=5)pts.push(proj(lo,la));g+='<path class="grat" d="'+polyD(pts)+'"/>';}

 for(const c of DATA.countries){if(P5.has(c.id)){const p=proj(c.c[0],c.c[1]);g+='<text class="p5star" x="'+p[0].toFixed(1)+'" y="'+p[1].toFixed(1)+'" dy=".35em" text-anchor="middle">✦</text>';}}
 g+='<g id="fxArcs"></g><g id="fx"></g><g id="labels">';
 for(const c of DATA.countries){const p=proj(c.c[0],c.c[1]),nm=LABEL_NAME[c.id]||c.name;
  g+='<text class="lbl" data-id="'+c.id+'" x="'+p[0].toFixed(1)+'" y="'+p[1].toFixed(1)+'" dy="'+(P5.has(c.id)?'1.45em':'.35em')+'" text-anchor="middle" display="none">'+nm+'</text>';}
 g+='</g><g id="fpMarks">'+marksSVG()+'</g><g id="fxTop"></g>';
 svg.innerHTML=g;
 LBL=DATA.countries.map(c=>{let w=0,h=0,a=0;for(const r of c.p){let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9,s=0,f=null,q0=null;
   for(const q of r){const p=proj(q[0],q[1]);x0=Math.min(x0,p[0]);x1=Math.max(x1,p[0]);y0=Math.min(y0,p[1]);y1=Math.max(y1,p[1]);if(q0)s+=q0[0]*p[1]-p[0]*q0[1];else f=p;q0=p;}
   if(f)s+=q0[0]*f[1]-f[0]*q0[1];a=Math.max(a,Math.abs(s)/2); /* largest landmass area; Equal Earth is equal-area */
   if(x1-x0>w){w=x1-x0;h=y1-y0;}}

  return{id:c.id,el:svg.querySelector('.lbl[data-id="'+c.id+'"]'),x:p[0],y:p[1],p5:P5.has(c.id),w,h,a,em:null,on:false};}).sort((a,b)=>b.a-a.a);
}
/* greedy placement: the selected country, then yours, then largest first; a label that would overlap one already placed stays hidden.
   Big countries (on screen) may let their name overhang their outline, e.g. Argentina or South Africa at world zoom. */
const LABEL_BIG_PX2=1000,LABEL_OVERHANG=2.4;
function labelsLOD(){const r=svg.getBoundingClientRect();if(r.width<2)return;const k=r.width/vb.w,placed=[];
 const first=LBL.filter(L=>L.id===sel||L.id===player).sort((a,b)=>(b.id===sel)-(a.id===sel));
 for(const L of first.concat(LBL.filter(L=>L.id!==sel&&L.id!==player))){
  if(!L.em){L.el.setAttribute('display','inline');L.em=L.el.getComputedTextLength()/(parseFloat(getComputedStyle(L.el).fontSize)||1);L.el.setAttribute('display',L.on?'inline':'none');
   if(!L.em)continue;} /* not laid out yet: measure again next time */
  const tw=L.em*LABEL_PX,room=L.w*k*(L.a*k*k>=LABEL_BIG_PX2?LABEL_OVERHANG:1);let on=L.id===sel||(room>=tw+6&&L.h*k>=LABEL_PX*1.2);
  if(on){const bw=(tw+14)/k,bh=LABEL_PX*1.3/k,cy=L.y+(L.p5?1.1*LABEL_PX/k:0),b=[L.x-bw/2,cy-bh/2,L.x+bw/2,cy+bh/2];
   if(L.id!==sel&&placed.some(o=>b[0]<o[2]&&b[2]>o[0]&&b[1]<o[3]&&b[3]>o[1]))on=false;else placed.push(b);}
  if(on!==L.on){L.on=on;L.el.setAttribute('display',on?'inline':'none');}
  L.el.classList.toggle('you',L.id===player);}}
/* ---- map lenses (fun plan V2): the same map coloured by one question at a time, from C data. Bins sit on the game's own
   rule lines; relations is diverging (red <- neutral land -> blue, 3 steps each side), trade is one sequential teal hue.
   Steps validated with the dataviz palette validator on the land colour: each arm monotone, mild step >= 2:1 vs land,
   red vs blue separated under colour-blind simulation at every step (deltaE >= 18).
   Values are also in the tooltip and inspector, so colour never carries meaning alone. ---- */
const LAND='#26303e';
const LENSES={
 control:{name:'Control'},
 relations:{name:'Relations',title:'Relations with you',value:c=>c.rel,fmt:v=>String(Math.round(v)),
  bins:[[20,'#f66d67','Enemies: under 20','<20'],[32,'#ce514d','Hostile: trade disrupted (<32)','<32'],[40,'#a83634','Cool: sanctions possible (<40)','<40'],
        [55,LAND,'Neutral','–'],[65,'#1c5cab','Warm: alliance possible (55+)','55+'],[80,'#3987e5','Friendly','65+'],[Infinity,'#86b6ef','Close: 80+','80+']]},
 trade:{name:'Trade',title:'Your share of their trade',value:c=>tradeWeight(c.id,player),fmt:v=>Math.round(v*100)+'%',
  bins:[[1e-9,LAND,'Not a partner','–'],[0.05,'#006960','Under 5%','<5%'],[0.10,'#00867b','5–10%: tariffs bite','5%+'],[0.15,'#16a396','10–15%','10%+'],[Infinity,'#2ec1b3','15% and up','15%+']]},
};
let lens='control',lensUI='';try{const v=localStorage.getItem('sovereign_lens');if(LENSES[v])lens=v;}catch(e){}
function lensNow(){return player?lens:'control';} /* relations and trade are relative to your nation */
function lensFill(c){const L=LENSES[lensNow()];if(!L.bins||c.id===player)return '';const v=L.value(c);for(const [hi,col] of L.bins)if(v<hi)return col;return '';}
function renderLens(){const k=lensNow()+(player?'1':'0');if(k===lensUI)return;lensUI=k;const el=document.getElementById('lensbar');if(!el)return;const cur=LENSES[lensNow()];
 el.innerHTML='<div class="seg" role="group" aria-label="Map lens">'+Object.entries(LENSES).map(([id,L])=>'<button type="button" data-lens="'+id+'" aria-pressed="'+(id===lensNow())+'"'+(id!=='control'&&!player?' disabled title="Choose a nation first"':'')+'>'+L.name+'</button>').join('')+'</div>';
 const key=document.getElementById('lenskey');if(!key)return;key.hidden=!cur.bins;
 key.innerHTML=cur.bins?'<b>'+cur.title+'</b>'+cur.bins.map(([,col,lab,short])=>'<span title="'+lab+'"><i style="background:'+col+'"></i><em class="full">'+lab+'</em><em class="short">'+short+'</em></span>').join(''):'';}
function setLens(id){if(!LENSES[id]||(id!=='control'&&!player))return;lens=id;try{localStorage.setItem('sovereign_lens',id);}catch(e){}paint();}
/* ---- map motion (fun plan V3): pulse rings, floating numbers, flowing trade arcs. UI only: reads state, never changes it,
   never calls rng(). Animates only transform/opacity; under prefers-reduced-motion every effect has a still version. ---- */
const SVGNS='http://www.w3.org/2000/svg';
const FX={
 MAX_ARCS:20,MAX_MARKS:24,live:[],arcKey:'',lastStatus:{},recent:{},stack:{},
 reduced(){return matchMedia('(prefers-reduced-motion: reduce)').matches;},
 at(id){const c=C[id];return c?proj(c.c[0],c.c[1]):null;},
 unit(){const r=svg.getBoundingClientRect();return r.width>2?vb.w/r.width:1;}, /* map units per screen px */
 reset(){for(const g of ['fxArcs','fx','fxTop']){const el=document.getElementById(g);if(el)el.textContent='';}this.live=[];this.arcKey='';this.lastStatus={};this.recent={};this.stack={};},
 mark(el,layer,ms){const g=document.getElementById(layer);if(!g)return false;g.appendChild(el);this.live.push(el);
  while(this.live.length>this.MAX_MARKS)this.live.shift().remove();
  setTimeout(()=>{el.remove();const i=this.live.indexOf(el);if(i>=0)this.live.splice(i,1);},ms);return true;},
 pulse(id,kind){const p=this.at(id);if(!p)return;const now=performance.now();if(now-(this.recent[id]??-1e9)<120)return;this.recent[id]=now;
  const el=document.createElementNS(SVGNS,'circle');el.setAttribute('class','fx fx-pulse '+(kind||''));
  el.setAttribute('cx',p[0].toFixed(1));el.setAttribute('cy',p[1].toFixed(1));el.setAttribute('r',(18*this.unit()).toFixed(2));
  if(this.mark(el,'fx',1700)&&!this.reduced())el.animate([{transform:'scale(.2)',opacity:.95},{transform:'scale(1)',opacity:0}],{duration:1600,easing:'cubic-bezier(.2,.7,.3,1)',fill:'forwards'});},
 float(id,text,kind){const p=this.at(id);if(!p)return;const u=this.unit(),now=performance.now();
  const st=this.stack[id]&&now-this.stack[id].t<400?this.stack[id]:(this.stack[id]={t:now,n:-1});st.n++; /* stack lines shown together */
  const el=document.createElementNS(SVGNS,'text');el.setAttribute('class','fx fx-float '+(kind||''));el.setAttribute('text-anchor','middle');
  el.setAttribute('x',p[0].toFixed(1));el.setAttribute('y',(p[1]-(12+st.n*15)*u).toFixed(1));el.style.fontSize=(12*u).toFixed(2)+'px';el.textContent=text;
  if(this.mark(el,'fxTop',2100)&&!this.reduced())el.animate([{transform:'translateY(0)',opacity:1},{transform:'translateY('+(-28*u).toFixed(2)+'px)',opacity:0}],{duration:2000,easing:'ease-out',fill:'forwards'});},
 /* a country changed hands (called from paint) */
 status(c){const prev=this.lastStatus[c.id];this.lastStatus[c.id]=c.status;
  if(player&&prev!==undefined&&prev!==c.status)this.pulse(c.id,c.status==='econ'||c.status==='annex'||c.status==='player'?'you':c.status==='rival'?'bad':'warn');},
 /* your trade routes: refreshed each month, or at once when a route's health changes (war, hostility, sanctions, tariffs) */
 routeKind(id){const c=C[id];return me.war?.enemy===id||c.rel<32||c.press?.sanc?'bad':(c.press?.tar||c.press?.exp)?'warn':'good';},
 arcsDue(){if(!player){if(this.arcKey){this.arcKey='';const g=document.getElementById('fxArcs');if(g)g.textContent='';}return;}
  const k=player+':'+date.getUTCFullYear()+'-'+date.getUTCMonth()+':'+tradePartners(player).slice(0,6).map(([id])=>this.routeKind(id)[0]).join('');
  if(k!==this.arcKey){this.arcKey=k;this.tradeArcs();}},
 tradeArcs(){const g=document.getElementById('fxArcs');if(!g)return;g.textContent='';if(!player)return;
  const a=this.at(player),still=this.reduced(),N=12;
  for(const [pid,w] of tradePartners(player).slice(0,Math.min(6,this.MAX_ARCS))){const b=this.at(pid);if(!b)continue;const kind=this.routeKind(pid);
   const mx=(a[0]+b[0])/2,cy=(a[1]+b[1])/2-Math.hypot(b[0]-a[0],b[1]-a[1])*0.28;
   const path=document.createElementNS(SVGNS,'path');path.setAttribute('class','fx fx-arc '+kind);
   path.setAttribute('d','M'+a[0].toFixed(1)+' '+a[1].toFixed(1)+'Q'+mx.toFixed(1)+' '+cy.toFixed(1)+' '+b[0].toFixed(1)+' '+b[1].toFixed(1));
   path.style.strokeWidth=(0.8+w*8).toFixed(2);g.appendChild(path);
   if(kind==='bad')continue; /* nothing moves on a cut route */
   const pts=[];for(let i=0;i<=N;i++){const t=i/N;pts.push([(1-t)*(1-t)*a[0]+2*(1-t)*t*mx+t*t*b[0],(1-t)*(1-t)*a[1]+2*(1-t)*t*cy+t*t*b[1]]);}
   const n=w>=0.12?3:2;
   for(let k=0;k<n;k++){const dot=document.createElementNS(SVGNS,'circle');dot.setAttribute('class','fx fx-cargo '+kind);
    if(still){const q=pts[Math.round((k+1)*N/(n+1))];dot.setAttribute('cx',q[0].toFixed(1));dot.setAttribute('cy',q[1].toFixed(1));g.appendChild(dot);continue;}
    dot.setAttribute('cx','0');dot.setAttribute('cy','0');g.appendChild(dot);
    dot.animate(pts.map((q,i)=>({transform:'translate('+q[0].toFixed(1)+'px,'+q[1].toFixed(1)+'px)',opacity:i===0||i===N?0:1})),{duration:3400,iterations:Infinity,delay:-k*3400/n});}}},
 /* action feedback: what actually changed, read before and after */
 snap(id){return {id:C[id]&&id!==player?id:null,rel:C[id]?.rel,infl:C[id]?.infl,cash:me?me.treasury-me.debt:0,appr:me?.approval,war:me?.war?.score};},
 diff(s,kind){if(!me)return;const sg=(v,u)=>(v>0?'+':'\u2212')+Math.abs(v)+u;
  if(s.id){const c=C[s.id],dr=Math.round(c.rel-s.rel),di=Math.round(c.infl-s.infl);
   if(dr||di)this.pulse(s.id,kind);if(dr)this.float(s.id,sg(dr,' rel'),dr>0?'good':'bad');if(di)this.float(s.id,sg(di,' control'),'you');}
  const dc=me.treasury-me.debt-s.cash,da=Math.round(me.approval-s.appr),money=Math.abs(dc)>=1e6;
  if(!s.id&&(money||da))this.pulse(player,kind);
  if(money)this.float(player,(dc>0?'+':'\u2212')+usd(Math.abs(dc)),dc>0?'good':'warn');
  if(da)this.float(player,sg(da,' approval'),da>0?'good':'bad');
  if(me.war&&s.war!=null){const dw=Math.round(me.war.score-s.war);if(dw)this.float(me.war.enemy,sg(dw,' war score'),dw>0?'good':'bad');}},
};
/* every player action and crisis choice shows what it changed (buttons call these by their global names) */
for(const [fn,kind] of [['doDeal','good'],['doBuyBonds','good'],['doTariff','warn'],['doSanction','bad'],['doExportCtrl','warn'],['doLiftPressure','good'],['doAlly','good'],['doUnally','warn'],['doDeclareWar','bad'],['doPush','warn'],['doHold','warn'],['doPeace','good'],['doInvest','good'],['doDefend','warn'],['doBuildRes','good'],['chooseEvent','warn']]){

function scls(s){return s==='player'?'player':s==='econ'?'econ':s==='annex'?'annex':s==='rival'?'rival':'';}
function paint(){svg.querySelectorAll('.country').forEach(p=>{const c=C[p.dataset.id];p.setAttribute('class','country '+scls(c.status)+(c.ally&&c.status!=='player'?' ally':'')+(sel===c.id?' sel':''));p.style.fill=lensFill(c);FX.status(c);});renderLens();labelsLOD();dirty=false;}

function heldGDP(){let s=0;for(const id of order){const c=C[id];if(c.status==='player'||c.status==='econ'||c.status==='annex')s+=c.gdp;}return s;}
function heldN(){let n=0;for(const id of order){const c=C[id];if(c.status==='player'||c.status==='econ'||c.status==='annex')n++;}return n;}
function curTotal(){let s=0;for(const id of order)s+=C[id].gdp;return s;}

/* about = ids a world-news line concerns; it reaches the feed only if one of them is in your circle (F5) */
function say(t,cls,about){if(about&&!about.some(inMyCircle))return;feed.unshift({t:fmtDate()+' · '+t,c:cls||''});feed=feed.slice(0,8);
 if(about)about.forEach(id=>ui('pulse',id,cls==='good'?'good':cls==='bad'?'bad':'warn'));}
function inMyCircle(id){if(!me)return false;if(id===player)return true;const c=C[id];if(!c)return false;
 if(c.ally||c.status==='econ'||c.status==='annex'||me.war?.enemy===id||anyPressureOn(c))return true;
 return tradePartners(player).slice(0,5).some(p=>p[0]===id);}
function fmtDate(){return date.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric',timeZone:'UTC'});}

/* ---- economy ---- */
function bondCost(c){return Math.max(c.gdp*0.02,4e9);}
function pay(x){me.treasury-=x;if(me.treasury<0){me.debt+=-me.treasury;me.treasury=0;}}
function tradeWeight(a,b){for(const [pid,w] of tradePartners(a))if(pid===b)return w;return 0;}
function depScore(id,kind){const r=WORLD_LIVING.res[id];return r?(r[kind]||0):0;}
function anyPressureOn(c){const p=c.press;return p&&(p.tar||p.sanc||p.exp);}
function anyPressureActive(){for(const id of order)if(id!==player&&anyPressureOn(C[id]))return true;return false;}
function pressureTick(c){
 if(!player||c.id===player)return;
 const p=c.press;if(!p||(!p.tar&&!p.sanc&&!p.exp))return;
 const tw=tradeWeight(c.id,player);
 let inflG=0,gDrag=0;
 if(p.tar){
  inflG+=tw*20;gDrag+=tw*0.04;
  c.rel=clamp(c.rel-2,0,100);
 }
 if(p.sanc){
  inflG+=tw*30;gDrag+=tw*0.10;
  c.rel=clamp(c.rel-5,0,100);
  me.infamy+=0.33;
 }
 if(p.exp){
  const tDep=depScore(c.id,p.exp),pDep=depScore(player,p.exp);
  const lev=clamp(tDep-pDep,0,1);
  inflG+=lev*20;gDrag+=lev*0.06;
 }
 inflG=Math.min(inflG,8);
 c.infl=clamp(c.infl+inflG,0,100);
 if(POWER_SET.has(c.id)&&c._econ){c._econ.growth=clamp(c._econ.growth-gDrag,-0.06,0.07);}
 else{c.gdp*=(1-gDrag/12);}
 if(c.infl>=100&&c.status!=='econ'){c.status='econ';say(c.name+' has fallen under your economic control \u2014 sustained pressure brought it to heel.','good');dirty=true;}
 if(rng()<0.10&&(p.tar||p.sanc)){
  say(c.name+' imposed counter-measures against your trade.','warn');
 }
 if(rng()<0.05&&c.status==='ind'&&(p.sanc||p.tar)){
  c.status='rival';say(c.name+' realigned toward a rival bloc in defiance of your pressure.','warn');dirty=true;
 }
}

function economyStep(days){
 const f=days/365, gdp=me.gdp;
 const D=me.dev,devG=D.infra*0.003+D.edu*0.002+D.ind*0.002+D.tech*0.0025;
 warStep(days);
 if(player==='USA'){me.worldRate=me.polRate;}
 else{me.worldRate=clamp(me.worldRate+((0.035-me.worldRate)*0.4+(rng()-0.5)*0.025)*f,0.003,0.13);}
 let ar=0,an=0;for(const id of me.majors){const c=C[id];if(c){ar+=(c.rel+getPR(id,player))/2;an++;}}
 me.majorRel=an?ar/an:50;
 const tDis=tradeDisruption();
 const tradeHealth=clamp((me.majorRel/100)*me.openness*(1-me.sanctions*0.9)*(1-tDis*0.85),0,1);
 me.trade=gdp*0.35*tradeHealth;
 me.tradeDis=tDis;
 const gTrade=(tradeHealth-0.30)*0.07-tDis*0.04;
 const B=me.base||BASE_OLD,{hike,gap}=rateGaps(me);
 const adeq=clamp(me.reserves/(gdp*0.15),0,1.5);
 let conf=clamp(confTarget(me,gdp,adeq),0.04,1);me.confidence+=(conf-me.confidence)*2*f;conf=me.confidence;
 const goldShare=me.goldPct/100;
 let goldDrift=(me.inflation-0.02)*1.1+Math.max(0,-me.cycle)*2.2+(0.5-conf)*0.14;
 me.goldPrice=clamp(me.goldPrice*(1+goldDrift*f),40,500);
 let fxTarget=clamp(100*(1+gap*3+(conf-B.conf0)*0.6-(me.war?0.12+0.2*Math.max(0,-me.war.score)/100:0)),18,320); /* CF-4: capital flees a war */
 me.fx+=(fxTarget-me.fx)*1.6*f;
 if(conf<0.25&&me.reserves<gdp*0.03)me.fx*=(1-0.6*f);
 me.fx=clamp(me.fx,10,340);
 let flow=gap*0.5+(conf-B.conf0)*0.4;
 me.reserves+=gdp*flow*0.08*f;
 me.reserves+=me.reserves*(1-goldShare)*me.worldRate*f;
 me.reserves+=me.reserves*goldShare*goldDrift*f;
 me.reserves=Math.max(0,me.reserves);
 const fxMult=clamp(100/me.fx,0.5,4);
 const ed=me.debt*((1-me.fxDebtShare)+me.fxDebtShare*fxMult);me.effDebt=ed;
 const resInfl=(resourceShock('oil',0.05)+resourceShock('food',0.03))*tDis;
 let inflT=clamp(B.pi+(me.growth-0.025)*0.6+(1-me.fx/100)*(me.fx>100?0.06:0.15)-hike*0.8+resInfl,-0.03,3);
 me.inflation+=(inflT-me.inflation)*1.3*f+(rng()-0.5)*0.003*f;
 me.inflation=clamp(me.inflation,-0.05,3);
 /* a heavy interest bill crowds out spending and investment */
 let g=0.026-0.05*Math.max(0,me.taxRate-Math.max(0.30,B.tax0))-0.12*me.sanctions-me.warDrag+me.cycle-0.6*Math.max(0,hike)-Math.min(0.03,0.3*Math.max(0,me.inflation-Math.max(0.05,B.infl0+0.02)))-0.04*Math.max(0,interestBurden(me,gdp)-0.3)+gTrade+devG;
 g=clamp(g,-0.10,0.09);me.growth=g;me.gdp=gdp*(1+g*f);
 me.yield=yieldOf(me,ed,gdp,conf,gap,D);
 /* debt rolls over gradually (about five and a half years on average), so its average cost drifts toward today's yield */
 me.avgRate=(me.avgRate??me.yield)+(me.yield-(me.avgRate??me.yield))*0.18*f;
 const rev=gdp*me.taxRate, spend=gdp*((me.spendBase??0.18)+me.milSpend), interest=ed*me.avgRate;
 me.bal=rev-spend-interest-(me.aidLost||0); /* CF-4: aid a patron stopped is money the budget no longer has */
 me.treasury+=me.bal*f;
 if(me.treasury<0){me.debt+=-me.treasury;me.treasury=0;}
 /* inflation erodes what is owed in your own currency, and your cash (amounts are in constant dollars) */
 const ero=clamp(me.inflation,-0.05,1)*f;me.debt=Math.max(0,me.debt-me.debt*(1-me.fxDebtShare)*ero);me.treasury-=me.treasury*ero;
 for(const id of order){const bc=C[id];if(bc.infl>0&&bc.status!=='player'){me.treasury+=bc.gdp*(bc.infl/100)*0.003*f;}}
 me.cycle=clamp(me.cycle+(rng()-0.5)*0.5*f,-0.025,0.025);
 me.warDrag=Math.max(0,me.warDrag-0.45*f);
 if(me.infamy<20)me.sanctions=Math.max(0,me.sanctions-0.5*f);
 me.infamy=Math.max(0,me.infamy-2*f);
 me.mil=clamp(me.mil+(me.milSpend-(B.mil0??0.03))*22*f+D.ind*1.5*f,1,100); /* against your starting share of GDP (SIPRI) */
 if(!me.war){if((me.readiness??100)<100)me.readiness=Math.min(100,me.readiness+2*f*12);if(me.aidLost&&me.aidUntil!=null&&gameDay>=me.aidUntil){me.aidLost=0;me.aidUntil=null;}}
 const tgt=clamp(55+g*650-Math.max(0,me.taxRate-Math.max(0.25,B.tax0))*140-me.sanctions*45-me.warDrag*320-Math.min(30,Math.max(0,me.inflation-0.03)*400)+D.edu*1.5+D.health*2,0,100);

 if(me.approval>=85&&me.growth>0.03&&(me.effDebt||me.debt)/me.gdp<0.6&&me.inflation<0.04&&!me.war)me.goldenDays+=days;else me.goldenDays=0;

function worldStep(days){const f=days/365;for(const id of order){const c=C[id];if(c.status!=='player'&&!POWER_SET.has(id))c.gdp*=(1+c.cg*f);}}
function aiStep(){
 if(me._lastWR!==undefined){const d=me.worldRate-me._lastWR;if(d>0.004)say('Rising US Treasury yields pull capital toward the dollar — your currency and bonds feel the strain.','warn');else if(d<-0.004)say('The US eases rates — capital rotates back toward other markets.','good');}

 fpStep();
 if(!pendingEvent&&!me.war&&rng()<0.09){const ev=pickEvent();if(ev){eventCD[ev.id]=gameDay;showEvent(ev);}}

 driftWorldRelations();
 for(const id of WORLD_LIVING.powers){if(id===player)continue;const pc=C[id];if(pc&&pc.status!=='player')simPowerEconomy(pc,30/365);}
 if(me.infamy>25){
   const p5=order.map(id=>C[id]).filter(c=>P5.has(c.id)&&c.status==='ind');

 }

   const p=powers.length?pick(powers):null;
   if(p){const t=nearestWeak(p);if(t){t.status='rival';say(p.name+' drew '+t.name+' into its sphere of influence.','',[p.id,t.id]);dirty=true;}}
 }

 }
 if(rng()<0.04){me.cycle=clamp(me.cycle-0.01,-0.025,0.025);say('Global markets wobble \u2014 a downturn spreads.','warn');}
 for(const id of order){if(id!==player)pressureTick(C[id]);}
 if(rng()<0.07){
  const hostilePow=order.map(id=>C[id]).filter(c=>POWER_SET.has(c.id)&&c.id!==player&&c.status!=='player'&&c.rel<30&&c.gdp>=me.gdp*0.5);
  if(hostilePow.length){const hp=pick(hostilePow);const tw=tradeWeight(player,hp.id);
   if(tw>0.03){me.sanctions=clamp(me.sanctions+tw*0.15,0,1);hp.rel=clamp(hp.rel-3,0,100);say(hp.name+' imposed economic restrictions against you \u2014 trade disrupted.','bad');}}
 }
 /* CF-4: a war on you follows the same rules as yours (invaders), and is then fought like yours (warStep) */

  if(p){say(fillText(WAR_TEXT.invaded,{b:p.name})+' '+WAR_TEXT.rally,'bad');me.approval=clamp(me.approval+6,0,100);p.rel=clamp(p.rel-20,0,100);startWar(p.id,p.id);dirty=true;}}}
}
/* a sphere never takes a bloc member (NATO, EU, CSTO, GCC) or a country a warm tie (treaty, MNNA) binds to another great power,
   and since CF-2 only reaches a land or sea neighbour (CAPABILITY.land / .sea): no more Russia → Bhutan */
function isNeighbour(a,b){return (CAPABILITY.land[a]||[]).includes(b)||CAPABILITY.sea.some(r=>(r[0]===a&&r[1]===b)||(r[0]===b&&r[1]===a));}
function boundElsewhere(c,f){for(const pid of WORLD_LIVING.powers){if(pid===f.id||pid===c.id)continue;const t=tieBetween(c.id,pid);if(t&&TIE_REL[t[2]]>50)return true;}return false;}
function nearestWeak(f){let b=null,bd=1e9;for(const id of order){const c=C[id];if(c.status!=='ind'||c.id===f.id)continue;if(c.mil>=15||!isNeighbour(f.id,c.id))continue;if(blocsOf(c.id).length||boundElsewhere(c,f))continue;if(c.mil>=f.mil*0.35)continue;if(P5.has(c.id))continue;const dx=f.c[0]-c.c[0],dy=f.c[1]-c.c[1],d=dx*dx+dy*dy;if(d<bd){bd=d;b=c;}}return b;}
function checkEnd(){
 if(ended)return;
 const wt=curTotal();const ctrl=heldGDP()/wt;
 let blocG=me.gdp||0;me.allies.forEach(id=>{const c=C[id];if(c&&(c.status==='ind'||c.status==='rival'))blocG+=c.gdp;});
 const blocShare=blocG/wt;
 let myMil=0,totMil=0;for(const id of order){const c=C[id];totMil+=c.mil;if(c.status==='player'||c.status==='annex')myMil+=c.mil;}
 const milShare=totMil?myMil/totMil:0;
 if(ctrl>=0.5){ended=true;endGame('win','\u25C6 Economic hegemony \u2014 your sovereign-debt holdings span over half the world economy.');}
 else if(milShare>=0.45){ended=true;endGame('win','\u25C6 Military domination \u2014 your forces command the globe.');}
 else if(blocShare>=0.6&&me.infamy<20){ended=true;endGame('win','\u25C6 Leader of a world alliance \u2014 your bloc commands most of the global economy, peacefully.');}
 else if(me.goldenDays>=730){ended=true;endGame('win','\u25C6 A golden age \u2014 your nation has thrived in lasting peace and prosperity.');}
 else if(me.approval<12){ended=true;endGame('lose','You were removed from power amid unrest and discontent.');}
 else if(me.inflation>Math.max(0.28,(me.base||BASE_OLD).infl0+0.2)&&me.fx<45){ended=true;endGame('lose','Currency collapse \u2014 hyperinflation swept your government from power.');}
 else if((me.effDebt||me.debt)/me.gdp>(me.base||BASE_OLD).crisisDebt&&me.yield-Math.max(0,(me.base||BASE_OLD).infl0-0.025)>0.09){ended=true;endGame('lose','Debt crisis \u2014 a collapsing currency and dollar debt broke your government.');}
}
/* CF-2: every country starts from its own sourced numbers (ECONOMY); a missing number keeps the old default.
   Rates, tax and inflation are then read against that start (me.base), so no economy breaks from its starting point alone;
   debt, interest, reserves and confidence stay absolute, so a real debt problem is felt as old debt rolls over. */
const BASE_OLD={i0:0.03,w0:0.03,tax0:0.22,infl0:0.025,pi:0.02,conf0:0.5,crisisDebt:2.5,mil0:0.03}; /* the start every country shared before CF-2 (older saves) */
function confTarget(c,gdp,adeq){const ib=interestBurden(c,gdp);
 return 0.62-0.35*clamp((c.debt/gdp-0.6)/1.6,0,1.6)*(0.4+0.6*c.fxDebtShare)-0.8*Math.max(0,ib-0.3)-0.4*c.sanctions-0.004*c.infamy
  -Math.min(0.25,2.2*Math.max(0,c.inflation-0.04))+0.28*adeq-0.3*c.fxDebtShare*Math.max(0,(100-c.fx)/100)+((c.dev&&c.dev.fin)||0)*0.02
  -(c.war?0.10+0.15*Math.max(0,-c.war.score)/100:0);} /* CF-4: investors flee a war, more so one you are losing */
/* hike: your policy rate above where you started; gap: the same against the world rate's move (what moves capital and your currency) */
function rateGaps(c){const B=c.base||BASE_OLD,hike=c.polRate-B.i0;return{hike,gap:hike-(c.worldRate-B.w0)};}
function interestBurden(c,gdp){return (c.effDebt||c.debt)*(c.avgRate??c.yield)/Math.max(gdp*c.taxRate,1);} /* interest paid ÷ revenue */
/* the market yield on your debt: what you owe in your own currency prices off your policy rate, what you owe in dollars off the
   world rate, both plus the same risk premium (debt, interest burden, sanctions, confidence) */
function yieldOf(c,ed,gdp,conf,gap,D){const risk=0.05*clamp((ed/gdp-0.6)/1.6,0,1.6)*(0.3+0.7*c.fxDebtShare)+0.04*Math.max(0,interestBurden(c,gdp)-0.3)+c.sanctions*0.03+(1-conf)*0.02-((D&&D.fin)||0)*0.003;

function startEconomy(c){const e=ECONOMY.rows[c.id]||{},v=(k,d)=>e[k]??d;
 const d0=v('debt',0.6);c.debt=c.gdp*d0;c.effDebt=c.debt;c.inflation=v('infl',0.025);c.polRate=v('rate',0.03);c.worldRate=c.id==='USA'?c.polRate:(ECONOMY.worldRate??0.04);c._lastWR=c.worldRate;
 c.reserves=c.gdp*v('res',0.10);c.taxRate=clamp(v('rev',0.22),0.05,0.75);
 c.fxDebtShare=clamp(e.fxShare??c.fxDebtShare??(0.62-((c.gdp/(c.pop||1e6))/60000)*0.5),0.03,0.95);
 c.avgRate=e.int!=null&&d0>0?e.int/d0:null;c.yield=0.03;
 const adeq=clamp(c.reserves/(c.gdp*0.15),0,1.5);c.confidence=clamp(confTarget(c,c.gdp,adeq),0.04,1);
 c.yield=yieldOf(c,c.debt,c.gdp,c.confidence,0,null);if(c.avgRate==null)c.avgRate=c.yield;
 /* spending is set so the first year's balance is the real one (clamped to ±12% of GDP: Timor-Leste and Libya spend oil funds,
    Ukraine wartime aid); with no figure, the -0.8% every country started with before */
 c.spendBase=c.taxRate-c.milSpend-clamp(e.bal??-0.008,-0.12,0.12)-d0*c.avgRate;
 c.base={i0:c.polRate,w0:c.worldRate,tax0:c.taxRate,infl0:c.inflation,pi:c.inflation,conf0:c.confidence,crisisDebt:Math.max(2.5,d0+0.5),mil0:c.milSpend};}
/* CF-3: how hard a country is, read from its real situation (Conflicts plan §2.0): 1-5 stars, never a separate setting,
   with the strengths and weaknesses behind them. Reads data only. */
const DIFF_TEXT={debtHigh:'Debt at {v} of GDP',debtLow:'Low debt ({v} of GDP)',interest:'Interest takes {v} of revenue',inflHigh:'Inflation at {v}',inflLow:'Stable prices',
 fxDebt:'{v} of the debt owed abroad, with thin reserves',resBig:'Large reserves ({v} of GDP)',armsIn:'Imports most of its weapons',armsOut:'Makes and exports weapons',
 party:'A party to {fp}',stake:'Involved in {fp}',mediator:'A mediator in {fp}: both sides need you',crown:'{Above} can overrule you',nuclear:'Nuclear-armed',big:'A large economy'};
function difficultyOf(id){const e=ECONOMY.rows[id]||{},cap=CAPABILITY,o=cap.offices[id]||{},w=[],st=[],pc=v=>Math.round(v*100)+'%',gdp=(C[id]||{}).gdp||0;let score=0;

function doDeal(id){if(!canAct())return;const c=C[id];useAct();c.rel=clamp(c.rel+12,0,100);const gain=Math.min(c.gdp,me.gdp)*0.008;me.treasury+=gain;say('Trade deal with '+c.name+' (relations '+Math.round(c.rel)+'%, +'+usd(gain)+' bilateral trade).','good');ui('inspector');ui('live');}
function doBuyBonds(id){if(!canAct())return;const c=C[id];useAct();const cost=bondCost(c);pay(cost);const fxMul=1+clamp((c.fxDebtShare||0.3)*0.8,0,0.5);const gain=clamp(10*fxMul,0,100-c.infl);c.infl=clamp(c.infl+gain,0,100);const relDelta=c.infl<=25?2:c.infl<=50?0:-4-(c.infl>75?2:0);c.rel=clamp(c.rel+relDelta,0,100);if(c.infl>=100){c.status='econ';say(c.name+' is now a client state \u2014 trapped by debt, it answers to you.','good');dirty=true;}else{const tier=c.infl<=25?'minor creditor':c.infl<=50?'major creditor':c.infl<=75?'debt dependency':'debt trap';say('Purchased '+usd(cost)+' in '+c.name+' sovereign bonds \u2014 '+tier+' ('+Math.round(c.infl)+'%).');}ui('inspector');ui('paint');ui('live');}
function doTariff(id){if(!canAct())return;const c=C[id];const tw=tradeWeight(c.id,player);
 if(tw<0.05){say('No trade leverage \u2014 '+c.name+' barely trades with you.','warn');ui('inspector');return;}
 if(c.press.tar){say('Tariffs already active against '+c.name+'.','warn');ui('inspector');return;}
 useAct();c.press.tar=1;c.rel=clamp(c.rel-6,0,100);
 say('You imposed tariffs on '+c.name+' \u2014 '+Math.round(tw*100)+'% of their trade is with you.','warn');ui('inspector');ui('paint');ui('live');}
function doSanction(id){if(!canAct())return;const c=C[id];
 if(c.rel>=40){say('Relations too warm to justify sanctions \u2014 lower them first.','warn');ui('inspector');return;}
 if(c.press.sanc){say('Sanctions already active against '+c.name+'.','warn');ui('inspector');return;}
 useAct();c.press.sanc=1;c.rel=clamp(c.rel-10,0,100);me.infamy+=4;
 const eb=blocsOf(id);order.forEach(o=>{if(o===player||o===id)return;const x=C[o];if(blocsOf(o).some(b=>eb.includes(b)))x.rel=clamp(x.rel-5,0,100);});
 say('You imposed full sanctions on '+c.name+' \u2014 the world is watching.','warn');dirty=true;ui('inspector');ui('paint');ui('live');}
function doExportCtrl(id,kind){if(!canAct())return;const c=C[id];
 const tDep=depScore(c.id,kind),pDep=depScore(player,kind);
 if(tDep<0.15){say(c.name+' is not dependent on '+kind+' imports.','warn');ui('inspector');return;}
 if(pDep>0.10){say('You are too dependent on '+kind+' imports yourself to restrict exports.','warn');ui('inspector');return;}
 if(c.press.exp===kind){say('Export controls on '+kind+' already active against '+c.name+'.','warn');ui('inspector');return;}
 useAct();c.press.exp=kind;c.rel=clamp(c.rel-4,0,100);
 say('You restricted '+kind+' exports to '+c.name+'.','warn');ui('inspector');ui('paint');ui('live');}
function doLiftPressure(id,inst){const c=C[id];
 if(inst==='tar'){c.press.tar=0;say('Tariffs on '+c.name+' lifted.','good');}
 else if(inst==='sanc'){c.press.sanc=0;say('Sanctions on '+c.name+' lifted.','good');}
 else if(inst==='exp'){c.press.exp=null;say('Export controls on '+c.name+' lifted.','good');}
 ui('inspector');ui('paint');ui('live');}
function doDefend(){if(!me)return;const spend=me.reserves*0.30;if(spend<me.gdp*0.004){say('Reserves too low to defend the currency.','bad');ui('live');return;}me.reserves-=spend;me.fx=clamp(me.fx+9,10,340);say('Central bank intervened in FX markets — the currency steadied, reserves fell.','warn');ui('live');}
function doBuildRes(){if(!me)return;const amt=Math.min(me.gdp*0.02,Math.max(me.treasury,0));if(amt<=0){say('No spare treasury to move into reserves — build a budget surplus first.','warn');ui('live');return;}me.treasury-=amt;me.reserves+=amt;say('Moved '+usd(amt)+' of treasury into foreign-exchange reserves.');ui('live');}
function doAlly(id){if(!canAct())return;const c=C[id];if(c.rel<55){say('Relations with '+c.name+' are too weak for an alliance — deepen them with deals first.','warn');ui('inspector');return;}useAct();c.ally=true;me.allies.add(id);c.rel=clamp(c.rel+8,0,100);say('Alliance formed with '+c.name+'.','good');ui('inspector');ui('paint');ui('live');}

function doDeclareWar(id){if(me.war){say('You are already at war \u2014 resolve it first.','warn');ui('inspector');return;}const c=C[id];
 if(!canReach(player,id)){say(fillText(WAR_TEXT.noReach,{b:c.name}),'warn');ui('inspector');return;}
 if(c.ally){c.ally=false;me.allies.delete(id);order.forEach(o=>{const x=C[o];if(x.ally)x.rel=clamp(x.rel-12,0,100);});say('You declared war on your own ally '+c.name+' \u2014 a shocking betrayal.','bad');}
 say('You declared war on '+c.name+'.'+(P5.has(id)?' A great power \u2014 its allies rally against you.':' The conflict begins.'),'warn');
 const pt=peaceTreaty(player,id);if(pt){me.infamy+=10;order.forEach(o=>{const x=C[o];if(o!==id&&x.status==='ind')x.rel=clamp(x.rel-4,0,100);});say(fillText(WAR_TEXT.treaty,{t:pt[3].replace(/, in force$/,'')}),'bad');}
 startWar(id,player);c.rel=clamp(c.rel-30,0,100);me.infamy+=(P5.has(id)?20:8);
 const eb=blocsOf(id);order.forEach(o=>{if(o===id)return;const x=C[o];if(x&&x.status==='ind'&&blocsOf(o).some(b=>eb.includes(b)))x.rel=clamp(x.rel-15,0,100);});
 ui('inspector');ui('paint');ui('live');}

function warOpOpen(){const w=me.war;if(!w)return false;if(gameDay-w.lastOp<30){say(WAR_TEXT.opUsed,'warn');ui('live');return false;}w.lastOp=gameDay;return true;}
function doPush(){if(!warOpOpen())return;const w=me.war,S=warStrength(w.enemy,w);

 if(rng()<clamp(0.2+0.7*S.yourS/(S.yourS+S.enemyS),0.15,0.85)){w.score=warScore(w,w.score+12,S);say(WAR_TEXT.offOk,'warn');}
 else{w.score=warScore(w,w.score-6,S);w.weary=clamp(w.weary+6,0,100);me.readiness=clamp((me.readiness??100)-3,15,100);say(WAR_TEXT.offBad,'bad');}

function doHold(){if(!warOpOpen())return;me.war.hold=gameDay+30;say(WAR_TEXT.hold);ui('live');}
function doPeace(){if(!me.war)return;const w=me.war,en=C[w.enemy];
 if(w.score>25){if(en)en.rel=clamp(en.rel+10,0,100);me.treasury+=me.gdp*0.01;say('You imposed a favourable peace on '+w.name+' \u2014 reparations paid.','good');warEnds(w,'won');}
 else if(w.score<-25){me.gdp*=0.98;me.approval=clamp(me.approval-5,0,100);me.treasury-=me.gdp*0.02;if(me.treasury<0){me.debt+=-me.treasury;me.treasury=0;}if(en)en.rel=clamp(en.rel-5,0,100);say('You accepted an unfavourable peace with '+w.name+': you pay reparations.','bad');warEnds(w,'terms');}
 else{if(en)en.rel=clamp(en.rel+15,0,100);say('You signed a white peace with '+w.name+' \u2014 the status quo holds.');warEnds(w,'white');}
 ui('inspector');ui('paint');ui('live');}

 /* saves before the UTC calendar (no cal) hold local midnight: keep the calendar day the player saw */
 date=s.cal==='utc'?new Date(s.date):(d=>new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())))(new Date(s.date));auto=!!s.auto;autoSpeed=s.autoSpeed||1;ended=!!s.ended;sel=s.sel||player;feed=s.feed||[];

function advance(days){
 if(!player||ended)return;
 for(let d=0;d<days;d++){
   const mo=date.getUTCMonth();
   date=new Date(date.getTime()+864e5);gameDay++;
   if(gameDay-(me.actDay||0)>=30){me.actsLeft=ACTS_PER_MONTH;me.actDay=gameDay;}
   economyStep(1);worldStep(1);
   if(date.getUTCMonth()!==mo)aiStep();
   checkEnd();if(ended)break;
 }
 if(player&&!ended)ui('autosave');
 if(sel&&player&&!ended)ui('inspector');
 ui('live');
}

 if(me.bal<0&&me.treasury<me.gdp*0.01)a.push(['You are running a deficit with little cash \u2014 you are borrowing to stay afloat, which adds to your debt.','warn']);
 if(sel&&sel!==player){const sc=C[sel];if(sc&&sc.status!=='econ'&&sc.status!=='annex'&&sc.status!=='player'){

 }}

function doExport(){
