<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"/>
<title>SOVEREIGN — World Console</title>
<style>
:root{
 --ocean:#0b1220;--bg:#070b12;--land:#26303e;--lstroke:#3a4a5e;
 --panel:#0e1622;--panel2:#122032;--border:#213048;--borders:#33445f;
 --text:#e7edf5;--t2:#93a1b3;--t3:#5f6f82;
 --econ:#26c2a8;--econl:#12564d;--annex:#c8463f;--annexl:#6e211d;
 --you:#e3ac3c;--youl:#7a5c17;--rival:#4c5468;--rivall:#333b49;
 --good:#3fbf87;--bad:#e0655f;--warn:#e0a93a;
 --mono:ui-monospace,'SF Mono','JetBrains Mono',Menlo,Consolas,monospace;
 --sans:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial;}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--sans);overflow:hidden}
.wrap{display:flex;flex-direction:column;height:100vh}
.top{display:flex;align-items:center;gap:14px;padding:9px 14px;border-bottom:1px solid var(--border);background:var(--panel);flex-wrap:wrap}
.brand{font-weight:700;letter-spacing:.22em;font-size:13px;text-transform:uppercase}.brand span{color:var(--you)}
.clock{display:flex;align-items:center;gap:6px}
.stat{font-family:var(--mono);font-size:12px;color:var(--t2)}.stat b{color:var(--text);font-weight:600}
.spacer{flex:1}
.btn{font-family:var(--sans);font-size:12px;padding:6px 11px;border-radius:7px;border:1px solid var(--borders);background:transparent;color:var(--text);cursor:pointer}
.btn[disabled]{opacity:.38;cursor:not-allowed;pointer-events:none}
.btn:hover{background:var(--panel2)}.btn.accent{border-color:var(--you);color:var(--you)}.btn.accent:hover{background:#20190a}
.btn.sm{padding:4px 8px;font-size:11px}
.vprog{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.vitem{display:flex;flex-direction:column;gap:2px;min-width:68px}
.vitem span{font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--t3);font-family:var(--mono)}
.vtrack{height:4px;border-radius:2px;background:#0a121e;border:1px solid #1b2a41;overflow:hidden}
.vfill{height:100%;background:var(--you);width:0;transition:width .35s}
.legend{display:flex;gap:11px;font-size:11px;color:var(--t2);flex-wrap:wrap;font-family:var(--mono)}
.dot{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.main{flex:1;display:grid;grid-template-columns:1fr 358px;min-height:0}
.mapwrap{position:relative;min-height:0;background:radial-gradient(circle at 50% 42%, #0e1a2b, var(--ocean))}
svg{width:100%;height:100%;display:block;touch-action:none}
.grat{stroke:#16233a;stroke-width:.25;fill:none}
.sphere{fill:var(--ocean);stroke:#22324a;stroke-width:.6}
.lbl{font-family:var(--sans);font-size:var(--lbl,11px);font-weight:600;letter-spacing:.08em;text-transform:uppercase;fill:#c9d4e3;fill-opacity:.6;pointer-events:none;paint-order:stroke;stroke:#0b1220;stroke-opacity:.6;stroke-width:.22em;stroke-linejoin:round}
.lbl.you{fill:var(--you);fill-opacity:.95}
#fxArcs,#fx,#fxTop,.fx{pointer-events:none}
.fx-pulse{fill:none;stroke:var(--econ);stroke-width:2;vector-effect:non-scaling-stroke;transform-box:fill-box;transform-origin:center}
.fx-pulse.bad{stroke:var(--bad)}.fx-pulse.warn{stroke:var(--warn)}.fx-pulse.you{stroke:var(--you)}
.fx-arc{fill:none;stroke:var(--econ);stroke-opacity:.6;stroke-dasharray:5 5;stroke-linecap:round;vector-effect:non-scaling-stroke}
.fx-arc.warn{stroke:var(--warn)}.fx-arc.bad{stroke:var(--bad);stroke-opacity:.45;stroke-dasharray:2 7}
.fx-cargo{fill:var(--econ);r:var(--dot,2px)}.fx-cargo.warn{fill:var(--warn)}
.fx-float{font-family:var(--mono);font-weight:700;fill:var(--good);paint-order:stroke;stroke:#0b1220;stroke-opacity:.75;stroke-width:.28em;stroke-linejoin:round}
.fx-float.bad{fill:var(--bad)}.fx-float.warn{fill:var(--warn)}.fx-float.you{fill:var(--you)}
@media (prefers-reduced-motion: reduce){.fx-pulse{opacity:.85}}
.country{fill:var(--land);stroke:var(--lstroke);stroke-width:.3;cursor:pointer;transition:fill .5s,stroke .5s}
.country:hover{filter:brightness(1.4)}
.country.player{fill:var(--youl);stroke:var(--you);stroke-width:.6}
.country.econ{fill:var(--econl);stroke:var(--econ);stroke-width:.5}
.country.annex{fill:var(--annexl);stroke:var(--annex);stroke-width:.5}
.country.rival{fill:var(--rivall);stroke:var(--rival);stroke-width:.4}
.country.ally{stroke:var(--you);stroke-dasharray:2.5 1.5;stroke-width:.55}
.country.sel{stroke:#fff;stroke-width:.9}
.p5star{fill:#dfe7f2;font-size:var(--star,7px);pointer-events:none;font-family:var(--sans)}
.tip{position:absolute;pointer-events:none;background:#0a1220f2;border:1px solid var(--borders);border-radius:6px;padding:6px 9px;font-size:12px;font-family:var(--mono);display:none;z-index:5;white-space:nowrap}
.tip .g{color:var(--econ)}.tip .p5{color:var(--you)}
.side{border-left:1px solid var(--border);background:var(--panel);overflow-y:auto;padding:13px}
.card{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:11px}
.eyebrow{font-size:10px;letter-spacing:.17em;text-transform:uppercase;color:var(--t3);font-family:var(--mono);margin-bottom:7px}
.cname{font-size:17px;font-weight:600}
.tag{display:inline-block;font-size:10px;font-family:var(--mono);padding:2px 7px;border-radius:20px;margin-left:7px;vertical-align:2px;text-transform:uppercase;letter-spacing:.07em}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:9px}
.metric .k{font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:.09em;font-family:var(--mono)}
.metric .v{font-size:16px;font-weight:600;font-family:var(--mono);margin-top:2px}
.row{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;padding:4px 0;border-bottom:1px solid #17243710}
.row .k{color:var(--t2);font-family:var(--mono);font-size:11px;letter-spacing:.04em}
.row .v{font-family:var(--mono);font-weight:600}
.bar{height:6px;border-radius:4px;background:#0a121e;overflow:hidden;margin-top:5px;border:1px solid #1b2a41}
.barf{height:100%;background:var(--econ);width:0;transition:width .3s}
.barf.rel{background:var(--you)}.barf.appr{background:var(--good)}.barf.debt{background:var(--warn)}
.acts{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.slab{margin-top:11px}.slab label{display:flex;justify-content:space-between;font-size:11px;color:var(--t2);font-family:var(--mono);margin-bottom:3px}
input[type=range]{width:100%;accent-color:var(--you);height:4px}
.hint{font-size:13px;color:var(--t2);line-height:1.6}
.feed{font-size:12px;color:var(--t2);line-height:1.6;font-family:var(--mono)}
.feed div{padding:3px 0;border-bottom:1px solid #17233618}
.feed .warn{color:var(--warn)}.feed .bad{color:var(--bad)}.feed .good{color:var(--good)}
.foot{font-size:10.5px;color:var(--t3);line-height:1.5;padding:2px 3px 6px}
.banner{padding:9px 11px;border-radius:8px;font-family:var(--mono);font-size:13px;margin-bottom:11px;border:1px solid}
.banner.win{background:#0c2a26;border-color:var(--econ);color:var(--econ)}
.banner.lose{background:#2a1211;border-color:var(--annex);color:var(--bad)}
.topmenu{display:contents}
#menuBtn,#sheetbar{display:none}
html,body{overscroll-behavior:none}
body{-webkit-tap-highlight-color:transparent}
.top,.btn,#sheetbar{user-select:none;-webkit-user-select:none}
@supports(height:100dvh){.wrap{height:100dvh}}
#searchbox{position:fixed;inset:0;background:#040810e6;display:none;z-index:60;padding:16px;padding-top:calc(16px + env(safe-area-inset-top))}
#searchbox .box{max-width:460px;margin:0 auto;background:var(--panel);border:1px solid var(--borders);border-radius:14px;padding:14px}
#searchbox input{width:100%;padding:12px;border-radius:9px;border:1px solid var(--borders);background:var(--panel2);color:var(--text);font-size:16px;outline:none;box-sizing:border-box}
#searchbox .res{max-height:50vh;overflow-y:auto;margin-top:10px;display:flex;flex-direction:column;gap:6px}
@media(hover:none){.tip{display:none!important}.country:hover{filter:none}}
@media(pointer:coarse){
 .btn{padding:12px 16px;font-size:14px;border-radius:9px}
 .btn.sm{padding:13px 13px;font-size:13px}
 input[type=range]{height:34px}
 .row{padding:7px 0}
 .acts{gap:9px}
}
@media(max-width:800px){
 .top{position:relative;padding:calc(6px + env(safe-area-inset-top)) 10px 6px;gap:8px}
 .top .stat,.top .legend,.top .vprog{display:none}
 .brand{font-size:11px}
 #menuBtn{display:inline-block}
 .topmenu{display:none;position:absolute;top:100%;right:6px;z-index:40;background:var(--panel);border:1px solid var(--borders);border-radius:10px;padding:10px;flex-direction:column;gap:8px;box-shadow:0 8px 30px #000a;min-width:170px}
 .topmenu.open{display:flex}
 .topmenu .btn{width:100%}
 .topmenu .legend{display:flex;flex-direction:column;gap:6px;padding:4px 2px}
 .main{display:block;position:relative}
 .mapwrap{position:absolute;inset:0}
 .side{position:absolute;left:0;right:0;bottom:0;z-index:20;border-left:none;border-top:1px solid var(--borders);border-radius:14px 14px 0 0;height:85%;transform:translateY(calc(100% - 110px));transition:transform .28s ease;padding-bottom:calc(13px + env(safe-area-inset-bottom));box-shadow:0 -6px 24px #0008}
 .side.half{transform:translateY(50%)}
 .side.full{transform:translateY(0)}
 #sheetbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:-13px;margin:-13px -13px 10px;padding:6px 14px 8px;background:var(--panel);z-index:2;border-radius:14px 14px 0 0;touch-action:none;cursor:grab}
 #sheetgrip{width:44px;height:5px;border-radius:3px;background:var(--borders);margin:4px auto 2px}
 #sheetbar .vprog{display:flex}
}
</style></head><body>

/* ---- economy ---- */
function bondCost(c){return Math.max(c.gdp*0.02,4e9);}
function pay(x){me.treasury-=x;if(me.treasury<0){me.debt+=-me.treasury;me.treasury=0;}}
function tradeWeight(a,b){for(const [pid,w] of tradePartners(a))if(pid===b)return w;return 0;}
function depScore(id,kind){const r=WORLD_LIVING.res[id];return r?(r[kind]||0):0;}
function anyPressureOn(c){const p=c.press;return p&&(p.tar||p.sanc||p.exp);}
function anyPressureActive(){for(const id of order)if(id!==player&&anyPressureOn(C[id]))return true;return false;}
function pressureTick(c){
 if(!player||c.id===player)return;
 const p=c.press;if(!p||(!p.tar&&!p.sanc&&!p.exp))return;
 const tw=tradeWeight(c.id,player);
 let inflG=0,gDrag=0;
 if(p.tar){
  inflG+=tw*20;gDrag+=tw*0.04;
  c.rel=clamp(c.rel-2,0,100);
 }
 if(p.sanc){
  inflG+=tw*30;gDrag+=tw*0.10;
  c.rel=clamp(c.rel-5,0,100);
  me.infamy+=0.33;
 }
 if(p.exp){
  const tDep=depScore(c.id,p.exp),pDep=depScore(player,p.exp);
  const lev=clamp(tDep-pDep,0,1);
  inflG+=lev*20;gDrag+=lev*0.06;
 }
 inflG=Math.min(inflG,8);
 c.infl=clamp(c.infl+inflG,0,100);
 if(POWER_SET.has(c.id)&&c._econ){c._econ.growth=clamp(c._econ.growth-gDrag,-0.06,0.07);}
 else{c.gdp*=(1-gDrag/12);}
 if(c.infl>=100&&c.status!=='econ'){c.status='econ';say(c.name+' has fallen under your economic control \u2014 sustained pressure brought it to heel.','good');dirty=true;}
 if(rng()<0.10&&(p.tar||p.sanc)){
  say(c.name+' imposed counter-measures against your trade.','warn');
 }
 if(rng()<0.05&&c.status==='ind'&&(p.sanc||p.tar)){
  c.status='rival';say(c.name+' realigned toward a rival bloc in defiance of your pressure.','warn');dirty=true;
 }
}

function economyStep(days){
 const f=days/365, gdp=me.gdp;
 const D=me.dev,devG=D.infra*0.003+D.edu*0.002+D.ind*0.002+D.tech*0.0025;
 if(me.war){const w=me.war,en=C[w.enemy];
   if(!en||en.status==='annex'||en.status==='player'){me.war=null;}
   else{let ys=me.mil;me.allies.forEach(id=>{const c=C[id];if(c&&(c.status==='ind'||c.status==='rival')&&c.rel>=55)ys+=c.mil*0.6;});ys*=(1+D.tech*0.06+D.ind*0.03);
     let es=en.mil;const eb=blocsOf(w.enemy);for(const id of order){if(id===w.enemy)continue;const c=C[id];if(c&&(c.status==='ind'||c.status==='rival')&&blocsOf(id).some(b=>eb.includes(b)))es+=c.mil*0.6;}
     w.yourS=ys;w.enemyS=es;
     w.score=clamp(w.score+((ys-es)/(ys+es)*40+(rng()-0.5)*22)*(days/30),-100,100);
     w.duration+=days;
     me.mil=clamp(me.mil-0.8*(days/30),1,100);en.mil=clamp(en.mil-0.8*(days/30),1,100);
     me.treasury-=gdp*0.017*(days/30);if(me.treasury<0){me.debt+=-me.treasury;me.treasury=0;}
     me.warDrag=Math.max(me.warDrag,0.018);me.approval=clamp(me.approval-1.1*(days/30),0,100);
     if(w.score>=80){en.status='annex';me.mil=clamp(me.mil+en.mil*0.2,1,100);me.infamy+=15;order.forEach(o=>{const x=C[o];if(x.status==='ind')x.rel=clamp(x.rel-8,0,100);});say('Victory! You conquered '+en.name+' after '+Math.round(w.duration/30)+' months of war.','good');me.war=null;dirty=true;}
     else if(w.score<=-80){const hd=order.map(id=>C[id]).filter(c=>c.status==='econ'||c.status==='annex');if(hd.length){const t=pick(hd);t.status='ind';say('Defeat \u2014 '+en.name+' forced you to relinquish '+t.name+'.','bad');}else{me.mil=clamp(me.mil*0.7,1,100);me.gdp*=0.95;me.approval=clamp(me.approval-10,0,100);say('Defeat \u2014 '+en.name+' overran your forces.','bad');}me.war=null;dirty=true;}
   }
 }
 if(player==='USA'){me.worldRate=me.polRate;}
 else{me.worldRate=clamp(me.worldRate+((0.035-me.worldRate)*0.4+(rng()-0.5)*0.025)*f,0.003,0.13);}
 let ar=0,an=0;for(const id of me.majors){const c=C[id];if(c){ar+=(c.rel+getPR(id,player))/2;an++;}}
 me.majorRel=an?ar/an:50;
 const tDis=tradeDisruption();
 const tradeHealth=clamp((me.majorRel/100)*me.openness*(1-me.sanctions*0.9)*(1-tDis*0.85),0,1);
 me.trade=gdp*0.35*tradeHealth;
 me.tradeDis=tDis;
 const gTrade=(tradeHealth-0.30)*0.07-tDis*0.04;
 const adeq=clamp(me.reserves/(gdp*0.15),0,1.5);
 let conf=0.62-0.35*clamp((me.debt/gdp-0.6)/1.6,0,1.6)-0.4*me.sanctions-0.004*me.infamy-2.2*Math.max(0,me.inflation-0.04)+0.28*adeq-0.3*me.fxDebtShare*Math.max(0,(100-me.fx)/100)+D.fin*0.02;
 conf=clamp(conf,0.04,1);me.confidence+=(conf-me.confidence)*2*f;conf=me.confidence;
 const goldShare=me.goldPct/100;
 let goldDrift=(me.inflation-0.02)*1.1+Math.max(0,-me.cycle)*2.2+(0.5-conf)*0.14;
 me.goldPrice=clamp(me.goldPrice*(1+goldDrift*f),40,500);
 let fxTarget=clamp(100*(1+(me.polRate-me.worldRate)*3+(conf-0.5)*0.6),18,320);
 me.fx+=(fxTarget-me.fx)*1.6*f;
 if(conf<0.25&&me.reserves<gdp*0.03)me.fx*=(1-0.6*f);
 me.fx=clamp(me.fx,10,340);
 let flow=(me.polRate-me.worldRate)*0.5+(conf-0.5)*0.4;
 me.reserves+=gdp*flow*0.08*f;
 me.reserves+=me.reserves*(1-goldShare)*me.worldRate*f;
 me.reserves+=me.reserves*goldShare*goldDrift*f;
 me.reserves=Math.max(0,me.reserves);
 const fxMult=clamp(100/me.fx,0.5,4);
 const ed=me.debt*((1-me.fxDebtShare)+me.fxDebtShare*fxMult);me.effDebt=ed;
 const resInfl=(resourceShock('oil',0.05)+resourceShock('food',0.03))*tDis;
 let inflT=clamp(0.02+(me.growth-0.025)*0.6+(1-me.fx/100)*(me.fx>100?0.06:0.15)-(me.polRate-0.03)*0.8+resInfl,-0.03,0.30);
 me.inflation+=(inflT-me.inflation)*1.3*f+(rng()-0.5)*0.003*f;
 me.inflation=clamp(me.inflation,-0.05,0.5);
 let g=0.026-0.05*Math.max(0,me.taxRate-0.30)-0.12*me.sanctions-me.warDrag+me.cycle-0.6*Math.max(0,me.polRate-0.03)-0.3*Math.max(0,me.inflation-0.05)+gTrade+devG;
 g=clamp(g,-0.10,0.09);me.growth=g;me.gdp=gdp*(1+g*f);
 me.yield=clamp(me.polRate+0.05*clamp((ed/gdp-0.6)/1.6,0,1.6)+me.sanctions*0.03+Math.max(0,me.worldRate-me.polRate)*0.6+(1-conf)*0.02-D.fin*0.003,0.003,0.25);
 const rev=gdp*me.taxRate, spend=gdp*(0.18+me.milSpend), interest=ed*me.yield;
 me.bal=rev-spend-interest;
 me.treasury+=me.bal*f;
 if(me.treasury<0){me.debt+=-me.treasury;me.treasury=0;}
 for(const id of order){const bc=C[id];if(bc.infl>0&&bc.status!=='player'){me.treasury+=bc.gdp*(bc.infl/100)*0.003*f;}}
 me.cycle=clamp(me.cycle+(rng()-0.5)*0.5*f,-0.025,0.025);
 me.warDrag=Math.max(0,me.warDrag-0.45*f);
 if(me.infamy<20)me.sanctions=Math.max(0,me.sanctions-0.5*f);
 me.infamy=Math.max(0,me.infamy-2*f);
 me.mil=clamp(me.mil+(me.milSpend-0.03)*22*f+D.ind*1.5*f,1,100);
 const tgt=clamp(55+g*650-Math.max(0,me.taxRate-0.25)*140-me.sanctions*45-me.warDrag*320-Math.max(0,me.inflation-0.03)*400+D.edu*1.5+D.health*2,0,100);
 me.approval+=(tgt-me.approval)*2*f;
 if(me.approval>=85&&me.growth>0.03&&(me.effDebt||me.debt)/me.gdp<0.6&&me.inflation<0.04&&!me.war)me.goldenDays+=days;else me.goldenDays=0;
}
function worldStep(days){const f=days/365;for(const id of order){const c=C[id];if(c.status!=='player'&&!POWER_SET.has(id))c.gdp*=(1+c.cg*f);}}
function aiStep(){
 if(me._lastWR!==undefined){const d=me.worldRate-me._lastWR;if(d>0.004)say('Rising US Treasury yields pull capital toward the dollar — your currency and bonds feel the strain.','warn');else if(d<-0.004)say('The US eases rates — capital rotates back toward other markets.','good');}
 me._lastWR=me.worldRate;
 if(!pendingEvent&&!me.war&&rng()<0.09){const ev=pickEvent();if(ev){eventCD[ev.id]=gameDay;showEvent(ev);}}
 driftWorldRelations();
 for(const id of WORLD_LIVING.powers){if(id===player)continue;const pc=C[id];if(pc&&pc.status!=='player')simPowerEconomy(pc,30/365);}
 if(me.infamy>25){
   const p5=order.map(id=>C[id]).filter(c=>P5.has(c.id)&&c.status==='ind');
   for(const p of p5)p.rel=clamp(p.rel-6,0,100);
   me.sanctions=clamp(me.sanctions+0.07,0,1);
   say('P5 powers condemn your aggression — sanctions tighten.','warn');dirty=true;
   if(rng()<0.35){const ax=order.map(id=>C[id]).filter(c=>c.status==='annex');if(ax.length){const l=pick(ax);l.status='ind';l.rel=clamp(l.rel-10,0,100);say('A coalition liberated '+l.name+' from your control.','bad');dirty=true;}}
 }
 if(rng()<0.08){
   const powers=order.map(id=>C[id]).filter(c=>(c.status==='ind'||c.status==='rival')&&c.id!==player&&c.mil>=25).sort((a,b)=>b.mil-a.mil).slice(0,6);
   const p=powers.length?pick(powers):null;
   if(p){const t=nearestWeak(p);if(t){t.status='rival';say(p.name+' drew '+t.name+' into its sphere of influence.','',[p.id,t.id]);dirty=true;}}
 }
 if(rng()<0.06){
   const cl=order.map(id=>C[id]).filter(c=>c.status==='rival');
   if(cl.length){const r=pick(cl);r.status='ind';say(r.name+' reasserted its independence.','',[r.id]);dirty=true;}
 }
 if(rng()<0.04){me.cycle=clamp(me.cycle-0.01,-0.025,0.025);say('Global markets wobble \u2014 a downturn spreads.','warn');}
 for(const id of order){if(id!==player)pressureTick(C[id]);}
 if(rng()<0.07){
  const hostilePow=order.map(id=>C[id]).filter(c=>POWER_SET.has(c.id)&&c.id!==player&&c.status!=='player'&&c.rel<30&&c.gdp>=me.gdp*0.5);
  if(hostilePow.length){const hp=pick(hostilePow);const tw=tradeWeight(player,hp.id);
   if(tw>0.03){me.sanctions=clamp(me.sanctions+tw*0.15,0,1);hp.rel=clamp(hp.rel-3,0,100);say(hp.name+' imposed economic restrictions against you \u2014 trade disrupted.','bad');}}
 }
 let alliedDef=0;me.allies.forEach(id=>{const c=C[id];if(c&&(c.status==='ind'||c.status==='rival'))alliedDef+=c.mil*0.5;});
 const effDef=me.mil+alliedDef;
 const aggr=order.map(id=>C[id]).filter(c=>(c.status==='ind'||c.status==='rival')&&c.id!==player&&!me.allies.has(c.id)&&c.rel<28&&c.mil>effDef*1.1);
 if(aggr.length&&rng()<0.13){
   const p=aggr.sort((a,b)=>b.mil-a.mil)[0];
   const hold=order.map(id=>C[id]).filter(c=>c.status==='econ'||c.status==='annex');

     if(hold.length){const t=pick(hold);t.status='rival';t.rel=clamp(t.rel-8,0,100);say(p.name+' attacked and seized '+t.name+' from your control.','bad');dirty=true;}
     else{me.mil=clamp(me.mil*0.7,1,100);me.gdp*=0.96;me.approval=clamp(me.approval-12,0,100);say(p.name+' invaded your homeland — territory lost, the economy reels.','bad');if(me.mil<8&&me.approval<20){ended=true;banner('lose',p.name+' overran your nation. Your government has fallen.');}}
   }else{p.mil=clamp(p.mil*0.8,1,100);me.approval=clamp(me.approval+4,0,100);say((backed?'Your alliance repelled ':'You repelled ')+'an attack by '+p.name+'.'+(backed?' Allied forces struck back.':' National resolve strengthens.'),'good');dirty=true;}
 }
}
function nearestWeak(f){let b=null,bd=1e9;for(const id of order){const c=C[id];if(c.status!=='ind'||c.id===f.id)continue;if(c.mil>=15)continue;if(c.mil>=f.mil*0.35)continue;if(P5.has(c.id))continue;const dx=f.c[0]-c.c[0],dy=f.c[1]-c.c[1],d=dx*dx+dy*dy;if(d<bd){bd=d;b=c;}}return b;}
function checkEnd(){
 if(ended)return;
 const wt=curTotal();const ctrl=heldGDP()/wt;
 let blocG=me.gdp||0;me.allies.forEach(id=>{const c=C[id];if(c&&(c.status==='ind'||c.status==='rival'))blocG+=c.gdp;});
 const blocShare=blocG/wt;
 let myMil=0,totMil=0;for(const id of order){const c=C[id];totMil+=c.mil;if(c.status==='player'||c.status==='annex')myMil+=c.mil;}
 const milShare=totMil?myMil/totMil:0;
 if(ctrl>=0.5){ended=true;banner('win','\u25C6 Economic hegemony \u2014 your sovereign-debt holdings span over half the world economy.');}
 else if(milShare>=0.45){ended=true;banner('win','\u25C6 Military domination \u2014 your forces command the globe.');}
 else if(blocShare>=0.6&&me.infamy<20){ended=true;banner('win','\u25C6 Leader of a world alliance \u2014 your bloc commands most of the global economy, peacefully.');}
 else if(me.goldenDays>=730){ended=true;banner('win','\u25C6 A golden age \u2014 your nation has thrived in lasting peace and prosperity.');}
 else if(me.approval<12){ended=true;banner('lose','You were removed from power amid unrest and discontent.');}

function doExport(){
 if(!player){say('Start a game before exporting.','warn');return;}
 const json=JSON.stringify(serializeState(),null,2),fname='sovereign-save-'+player+'-'+date.toISOString().slice(0,10)+'.json';
 if(window.Capacitor?.isNativePlatform?.()){
  const P=window.Capacitor.Plugins;
  P.Filesystem.writeFile({path:fname,data:json,directory:'CACHE',encoding:'utf8'})
   .then(r=>P.Share.share({title:fname,url:r.uri}))
   .then(()=>say('Save exported.','good'))
   .catch(()=>say('Export cancelled.','warn'));
  return;
 }
 const blob=new Blob([json],{type:'application/json'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);
 a.download=fname;a.click();
 URL.revokeObjectURL(a.href);say('Save exported.','good');
}
function doImport(file){
 const r=new FileReader();
 r.onload=()=>{try{if(applySave(JSON.parse(r.result)))say('Imported save loaded.','good');else say('Import failed — invalid save.','bad');}catch(e){say('Import failed — bad JSON.','bad');}};
 r.readAsText(file);
}
function updateLive(){
 setTxt('s-date',fmtDate());renderWar();renderAdvisor();renderVictory();
 if(me){
  setTxt('s-treas',usd(me.treasury));setTxt('s-debt',usd(me.debt));setTxt('m-treas',usd(me.treasury));setTxt('m-debt',usd(me.debt));
  const sh=Math.round(heldGDP()/curTotal()*100);setTxt('s-share',sh+'%');setTxt('m-share',sh+'%');
  setTxt('e-gdp',usd(me.gdp));
  const gs=document.getElementById('e-growth');if(gs){gs.textContent=(me.growth*100).toFixed(1)+'%';gs.style.color=me.growth>=0?'var(--good)':'var(--bad)';}
  setTxt('e-treas',usd(me.treasury));
  const bs=document.getElementById('e-bal');if(bs){bs.textContent=(me.bal>=0?'+':'')+usd(me.bal);bs.style.color=me.bal>=0?'var(--good)':'var(--bad)';}
  setTxt('e-debt',usd(me.debt));
  const dtg=(me.effDebt||me.debt)/me.gdp;const ds=document.getElementById('e-dtg');if(ds){ds.textContent=(dtg*100).toFixed(0)+'%';ds.style.color=dtg>1.2?'var(--bad)':dtg>0.9?'var(--warn)':'var(--text)';}
  const fxd=document.getElementById('e-fxdebt');if(fxd){fxd.textContent=Math.round(me.fxDebtShare*100)+'%';fxd.style.color=(me.fxDebtShare>0.4&&me.fx<90)?'var(--bad)':me.fxDebtShare>0.4?'var(--warn)':'var(--text)';}
  setTxt('e-trade',usd(me.trade));setTxt('t-open',Math.round(me.openness*100)+'%');
  const tde=document.getElementById('e-traded');if(tde){tde.textContent=Math.round((me.tradeDis||0)*100)+'%';tde.style.color=me.tradeDis>0.3?'var(--bad)':me.tradeDis>0.12?'var(--warn)':'var(--text)';}
  const ys=document.getElementById('e-yield');if(ys){ys.textContent=(me.yield*100).toFixed(2)+'%';ys.style.color=me.yield>0.06?'var(--warn)':'var(--text)';}
  setTxt('e-int',usd(me.debt*me.yield));
  setTxt('e-mil',Math.round(me.mil));
  {let am=0;me.allies.forEach(id=>{const c=C[id];if(c)am+=c.mil;});setTxt('e-allies',me.allies.size+' ('+Math.round(am)+' mil)');}
  setTxt('e-appl',Math.round(me.approval)+'%');const ab=document.getElementById('e-apprbar');if(ab)ab.style.width=clamp(me.approval,0,100)+'%';
  const sr=document.getElementById('sancrow');if(sr){if(me.sanctions>0.02){sr.style.display='';setTxt('e-sanc',Math.round(me.sanctions*100)+'%');}else sr.style.display='none';}
  setTxt('e-infl',(me.inflation*100).toFixed(1)+'%');const infs=document.getElementById('e-infl');if(infs)infs.style.color=me.inflation>0.06?'var(--bad)':(me.inflation>0.04||me.inflation<0)?'var(--warn)':'var(--text)';
  setTxt('e-prate',(me.polRate*100).toFixed(2)+'%');
  const wr=document.getElementById('e-wrate');if(wr){wr.textContent=(me.worldRate*100).toFixed(2)+'%';wr.style.color=me.worldRate>me.polRate?'var(--warn)':'var(--text)';}
  const df=me.polRate-me.worldRate;const dfe=document.getElementById('e-diff');if(dfe){dfe.textContent=(df>=0?'+':'')+(df*100).toFixed(2)+'%';dfe.style.color=df<0?'var(--bad)':'var(--good)';}
  const fxe=document.getElementById('e-fx');if(fxe){fxe.textContent=me.fx.toFixed(0);fxe.style.color=me.fx<85?'var(--bad)':me.fx<95?'var(--warn)':me.fx>110?'var(--good)':'var(--text)';}
  setTxt('e-res',usd(me.reserves));setTxt('e-gold',me.goldPrice.toFixed(0));
  setTxt('t-prate',(me.polRate*100).toFixed(2)+'%');setTxt('t-gold',Math.round(me.goldPct)+'%');
  setTxt('t-tax',Math.round(me.taxRate*100)+'%');setTxt('t-mil',Math.round(me.milSpend*100)+'%');
 }
 const fe=document.getElementById('feed');if(fe)fe.innerHTML=feed.length?feed.map(f=>'<div class="'+f.c+'">'+f.t+'</div>').join(''):'<div style="color:var(--t3)">Awaiting your first move.</div>';
 if(dirty)paint();
 FX.arcsDue();
}

/* ---- clock ---- */
function advance(days){
 if(!player||ended)return;
 for(let d=0;d<days;d++){
   const mo=date.getMonth();
   date=new Date(date.getTime()+864e5);gameDay++;
   if(gameDay-(me.actDay||0)>=30){me.actsLeft=ACTS_PER_MONTH;me.actDay=gameDay;}
   economyStep(1);worldStep(1);
   if(date.getMonth()!==mo)aiStep();
   checkEnd();if(ended)break;
 }
 if(player&&!ended)doSave(true);
 if(sel&&player&&!ended)renderInspector();
 updateLive();
}
document.getElementById('dayBtn').addEventListener('click',()=>advance(1));
document.getElementById('monthBtn').addEventListener('click',()=>advance(30));
document.getElementById('autoBtn').addEventListener('click',function(){if(ended)return;auto=!auto;this.textContent=auto?'❚❚ Pause':'▶ Auto';this.classList.toggle('accent',!auto);});
document.getElementById('speedBtn').addEventListener('click',function(){let i=autoOpts.indexOf(autoSpeed);autoSpeed=autoOpts[(i+1)%autoOpts.length];this.textContent=autoSpeed+'×';});
setInterval(()=>{if(auto&&player&&!ended)advance(autoSpeed);},800);
document.getElementById('reset').addEventListener('click',doReset);
document.getElementById('saveBtn').addEventListener('click',()=>doSave(false));
document.getElementById('loadBtn').addEventListener('click',doLoad);
document.getElementById('exportBtn').addEventListener('click',doExport);
document.body.insertAdjacentHTML('beforeend','<input type="file" id="importFile" accept="application/json,.json" style="display:none">');
document.getElementById('exportBtn').insertAdjacentHTML('afterend','<button class="btn sm" id="importBtn" title="Load save file">Import</button>');
document.getElementById('importBtn').addEventListener('click',()=>document.getElementById('importFile').click());
document.getElementById('importFile').addEventListener('change',e=>{if(e.target.files[0])doImport(e.target.files[0]);e.target.value='';});
function doReset(){if(player&&!ended&&!confirm('Start over? Your current campaign and saves will be deleted.'))return;reseed((Date.now()^((Math.random()*0xFFFFFFFF)|0))>>>0);initState();player=null;me=null;date=new Date(2025,0,1);auto=false;autoSpeed=1;ended=false;sel=null;feed=[];vb={x:0,y:0,w:1000,h:500};applyVB();document.getElementById('banner').innerHTML='';document.getElementById('econ').innerHTML='';document.getElementById('dev').innerHTML='';document.getElementById('war').innerHTML='';document.getElementById('advisor').innerHTML='';document.getElementById('victory-bar').style.display='none';document.getElementById('speedBtn').textContent='1×';document.getElementById('autoBtn').textContent='▶ Auto';document.getElementById('autoBtn').classList.add('accent');pendingEvent=null;FX.reset();var _m=document.getElementById('modal');if(_m)_m.style.display='none';try{localStorage.removeItem(SAVE_KEY);localStorage.removeItem(SAVE_KEY_MANUAL);}catch(e){}if(window.Capacitor?.isNativePlatform?.()){window.Capacitor.Plugins.Preferences.remove({key:SAVE_KEY}).catch(()=>{});window.Capacitor.Plugins.Preferences.remove({key:SAVE_KEY_MANUAL}).catch(()=>{});}renderInspector();paint();updateLive();}

/* ---- map interaction ---- */
buildMap();buildSide();
const MINW=30,MAXW=1000;
let vbRaf=0;function scheduleVB(){if(!vbRaf)vbRaf=requestAnimationFrame(()=>{vbRaf=0;applyVB();});}
function zoomAt(px,py,f){const r=svg.getBoundingClientRect();const mx=vb.x+(px-r.left)/r.width*vb.w,my=vb.y+(py-r.top)/r.height*vb.h;const nw=clamp(vb.w*f,MINW,MAXW),nh=nw/2;vb.x=mx-(mx-vb.x)*(nw/vb.w);vb.y=my-(my-vb.y)*(nh/vb.h);vb.w=nw;vb.h=nh;scheduleVB();}
const ptrs=new Map();let moved=false,pinchD=0;
svg.addEventListener('pointerdown',e=>{ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=false;if(ptrs.size===2){const[a,b]=[...ptrs.values()];pinchD=Math.hypot(a.x-b.x,a.y-b.y);}});
svg.addEventListener('pointermove',e=>{
 const p=ptrs.get(e.pointerId);
 if(p&&ptrs.size===1){const r=svg.getBoundingClientRect(),dx=e.clientX-p.x,dy=e.clientY-p.y;if(Math.abs(dx)+Math.abs(dy)>4)moved=true;if(moved){vb.x-=dx*vb.w/r.width;vb.y-=dy*vb.h/r.height;p.x=e.clientX;p.y=e.clientY;scheduleVB();}}
 else if(p&&ptrs.size===2){p.x=e.clientX;p.y=e.clientY;const[a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);if(d>4&&pinchD>4){zoomAt((a.x+b.x)/2,(a.y+b.y)/2,pinchD/d);moved=true;}pinchD=d;}
 const t=e.target.closest('.country'),tip=document.getElementById('tip');
 if(t&&!p&&matchMedia('(hover:hover)').matches){const c=C[t.dataset.id];let tipHtml=(P5.has(c.id)?'<span class="p5">✦ </span>':'')+c.name;
  if(c.leader)tipHtml+='<br><span style="color:var(--t2);font-size:11px">'+(c.leaderTitle||'Leader')+': '+c.leader+'</span>';
  tipHtml+=' &nbsp;<span class="g">'+usd(c.gdp)+'</span> · mil '+Math.round(c.mil);
  tip.style.display='block';tip.innerHTML=tipHtml;const r=svg.parentElement.getBoundingClientRect();tip.style.left=(e.clientX-r.left+13)+'px';tip.style.top=(e.clientY-r.top+13)+'px';}else tip.style.display='none';
});
function endPtr(e){ptrs.delete(e.pointerId);pinchD=0;}
window.addEventListener('pointerup',endPtr);window.addEventListener('pointercancel',endPtr);
svg.addEventListener('click',e=>{const t=e.target.closest('.country');if(t&&!moved){sel=t.dataset.id;renderInspector();paint();if(window.matchMedia('(max-width:800px)').matches)setSheet('half');}});
svg.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.clientX,e.clientY,e.deltaY<0?0.82:1.2);},{passive:false});

document.body.insertAdjacentHTML('beforeend','<div id="modal" style="position:fixed;inset:0;background:#040810e6;display:none;align-items:center;justify-content:center;z-index:50;padding:20px"><div id="modal-box" style="max-width:460px;width:100%;max-height:82vh;overflow-y:auto;background:var(--panel);border:1px solid var(--borders);border-radius:14px;padding:20px"></div></div>');

/* ---- mobile UI: bottom sheet, menu, search ---- */
const mqMobile=window.matchMedia('(max-width:800px)');
document.getElementById('side').insertAdjacentHTML('afterbegin','<div id="sheetbar"><div style="flex-basis:100%"><div id="sheetgrip"></div></div><span class="stat">treasury <b id="m-treas">—</b></span><span class="stat">debt <b id="m-debt">—</b></span><span class="stat">held <b id="m-share">0%</b></span></div>');
let sheetState='peek';
function setSheet(st){sheetState=st;const s=document.getElementById('side');s.classList.toggle('half',st==='half');s.classList.toggle('full',st==='full');}
(function(){const bar=document.getElementById('sheetbar');let sy=null;
 bar.addEventListener('pointerdown',e=>{sy=e.clientY;});
 bar.addEventListener('pointerup',e=>{if(sy==null)return;const dy=e.clientY-sy;sy=null;
  if(dy<-30)setSheet(sheetState==='peek'?'half':'full');
  else if(dy>30)setSheet(sheetState==='full'?'half':'peek');
  else setSheet(sheetState==='peek'?'half':sheetState==='half'?'full':'peek');});
})();
const vbarEl=document.getElementById('victory-bar'),topEl=document.querySelector('.top'),spacerEl=document.querySelector('.spacer');
function relocateUI(){if(mqMobile.matches)document.getElementById('sheetbar').appendChild(vbarEl);else topEl.insertBefore(vbarEl,spacerEl);}
mqMobile.addEventListener('change',relocateUI);relocateUI();
document.getElementById('menuBtn').addEventListener('click',e=>{e.stopPropagation();document.getElementById('topmenu').classList.toggle('open');});
document.addEventListener('click',e=>{if(!e.target.closest('#topmenu,#menuBtn'))document.getElementById('topmenu').classList.remove('open');});
document.body.insertAdjacentHTML('beforeend','<div id="searchbox"><div class="box"><input id="searchInput" placeholder="Search country…" autocomplete="off"><div class="res" id="searchRes"></div></div></div>');
const searchEl=document.getElementById('searchbox'),searchIn=document.getElementById('searchInput');
function renderSearch(q){q=q.trim().toLowerCase();
 const hits=order.map(id=>C[id]).filter(c=>!q||c.name.toLowerCase().includes(q)).sort((a,b)=>b.gdp-a.gdp).slice(0,12);
 document.getElementById('searchRes').innerHTML=hits.map(c=>'<button class="btn" style="text-align:left" data-go="'+c.id+'">'+c.name+' <span style="color:var(--t3);font-size:11px">'+usd(c.gdp)+'</span></button>').join('')||'<div class="hint">No match.</div>';}
document.getElementById('searchBtn').addEventListener('click',()=>{searchEl.style.display='block';searchIn.value='';renderSearch('');searchIn.focus();});
searchEl.addEventListener('click',e=>{if(e.target===searchEl)searchEl.style.display='none';});
searchIn.addEventListener('input',()=>renderSearch(searchIn.value));
searchIn.addEventListener('keydown',e=>{if(e.key==='Escape')searchEl.style.display='none';});
document.getElementById('searchRes').addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(!b)return;const c=C[b.dataset.go];sel=c.id;searchEl.style.display='none';
 const p=proj(c.c[0],c.c[1]);const path=svg.querySelector('[data-id="'+c.id+'"]');let fit=200;
 if(path){const bb=path.getBBox();fit=clamp(Math.max(bb.width,bb.height*2)*6,MINW,1000);}
 vb.w=Math.min(vb.w,fit);vb.h=vb.w/2;vb.x=p[0]-vb.w/2;vb.y=p[1]-vb.h/2;applyVB();
 renderInspector();paint();if(mqMobile.matches)setSheet('half');});

initState();
try{const boot=localStorage.getItem(SAVE_KEY);if(boot){const s=JSON.parse(boot);if(s&&s.player)applySave(s);}}
catch(e){}
if(!player){renderInspector();paint();updateLive();}
if(mqMobile.matches){
 setSheet(player?'peek':'half');
 const cc=player?C[player]:null,p=cc?proj(cc.c[0],cc.c[1]):proj(20,20);
 vb.w=cc?270:420;vb.h=vb.w/2;vb.x=p[0]-vb.w/2;vb.y=p[1]-vb.h/2;applyVB();
}else{applyVB();vb.y=(H-vb.h)/2;applyVB();} /* px-constant star/label sizes + first label layout; wider-than-2:1 windows crop around the middle */

/* ---- native shell (Capacitor) ---- */
if(window.Capacitor?.isNativePlatform?.()){
 const P=window.Capacitor.Plugins;
 P.App.addListener('backButton',()=>{
  const tm=document.getElementById('topmenu'),modal=document.getElementById('modal');
  if(searchEl.style.display==='block'){searchEl.style.display='none';return;}
  if(tm.classList.contains('open')){tm.classList.remove('open');return;}
  if(modal&&modal.style.display==='flex')return;
  if(mqMobile.matches&&sheetState!=='peek'){setSheet('peek');return;}
  P.App.minimizeApp();
 });
 if(!localStorage.getItem(SAVE_KEY)){
  P.Preferences.get({key:SAVE_KEY}).then(r=>{
   if(r&&r.value&&!player){try{const s=JSON.parse(r.value);if(s&&s.player){localStorage.setItem(SAVE_KEY,r.value);applySave(s);}}catch(e){}}
  }).catch(()=>{});
  P.Preferences.get({key:SAVE_KEY_MANUAL}).then(r=>{if(r&&r.value){try{localStorage.setItem(SAVE_KEY_MANUAL,r.value);}catch(e){}}}).catch(()=>{});
 }
 if(P.StatusBar){P.StatusBar.setOverlaysWebView({overlay:true}).catch(()=>{});P.StatusBar.setStyle({style:'DARK'}).catch(()=>{});}
}
